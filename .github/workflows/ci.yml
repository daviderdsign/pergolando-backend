name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./data/db.sqlite"
      BUNDLE_PATH: "./test/fixtures/bundle"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - run: mkdir -p data

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma migrate (test DB)
        run: pnpm prisma migrate deploy

      - name: Unit + integration tests (coverage)
        run: pnpm test:cov

      # NOTE: this is a thin first vertical slice (auth + bundle loading only) —
      # the 85% gate isn't enforced as a hard failure yet. Raise this once more
      # slices land; see README "Coverage gate" section.
      - name: Coverage summary
        run: cat coverage/coverage-summary.json 2>/dev/null || echo "no coverage-summary.json produced"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pergolando-backend:ci .
